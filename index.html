<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI依赖症自我测评</title>
    <style>
        /* 全局基础样式 */
        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #1e1e30; color: #ffffff;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }
        .container { width: 100%; max-width: 600px; padding: 40px 20px; box-sizing: border-box; text-align: center; margin: 0 auto; }

        /* 页面切换控制 */
        .page { display: none; animation: fadeIn 0.4s ease-out; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* P1 首页样式 */
        .header-text { color: #8a8a9d; font-size: 14px; letter-spacing: 1px; margin-bottom: 30px; }
        .main-title { font-size: 46px; font-weight: bold; margin: 0 0 15px 0; line-height: 1.1; text-align: left; }
        .highlight { color: #d4b848; }
        .subtitle { font-size: 16px; color: #b0b0c0; margin: 10px 0 60px 0; line-height: 1.6; text-align: left; }

        /* 按钮通用样式 */
        .btn-next { background-color: #3a3a52; color: white; border: none; padding: 16px 40px; font-size: 16px; border-radius: 30px; cursor: pointer; margin-top: 20px; width: 100%; transition: background-color 0.3s; }
        .btn-next:hover { background-color: #505070; }

        /* 填写信息页样式 */
        .form-title { font-size: 22px; margin-bottom: 40px; }
        .form-group { margin-bottom: 25px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; color: #b0b0c0; font-size: 14px; }
        .form-group input { width: 100%; padding: 15px; background-color: #2a2a40; border: 1px solid #3a3a52; border-radius: 8px; color: white; font-size: 16px; box-sizing: border-box; outline: none; transition: border-color 0.3s; }
        .form-group input:focus { border-color: #d4b848; }

        /* P2 测评页样式 */
        .page-title { font-size: 22px; margin-bottom: 30px; text-align: center; }
        .option-list { list-style: none; padding: 0; margin: 0 0 40px 0; }
        .option-item { background-color: #2a2a40; border: 1px solid #3a3a52; border-radius: 12px; margin-bottom: 12px; padding: 18px 20px; cursor: pointer; display: flex; align-items: center; transition: all 0.3s; text-align: left; }
        .option-item:hover { background-color: #3a3a52; }
        .option-item.selected { background-color: #3a3a52; border-color: #d4b848; }
        .option-number { font-size: 14px; color: #d4b848; margin-right: 15px; font-weight: bold; min-width: 25px; }
        .option-content { flex: 1; }
        .option-title { font-size: 15px; font-weight: bold; margin-bottom: 4px; }
        .option-desc { font-size: 13px; color: #8a8a9d; }
        .checkbox-mark { width: 22px; height: 22px; border: 2px solid #505070; border-radius: 50%; margin-left: 15px; position: relative; transition: all 0.3s; flex-shrink: 0; }
        .option-item.selected .checkbox-mark { background-color: #d4b848; border-color: #d4b848; }
        .option-item.selected .checkbox-mark::after { content: '✓'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #1e1e30; font-size: 14px; font-weight: bold; }

        /* 量表页样式（修复了换行显示和按钮对齐） */
        .scale-instruction { font-size: 13px; color: #8a8a9d; margin-bottom: 30px; text-align: left; line-height: 1.8; background-color: #2a2a40; padding: 20px; border-radius: 12px; border: 1px solid #3a3a52; }
        .scale-item { margin-bottom: 35px; }
        .scale-item:last-child { margin-bottom: 0; }
        .scale-item-text { font-size: 15px; color: #dcdcdc; line-height: 1.6; margin-bottom: 15px; }
        .scale-options { display: flex; justify-content: space-between; gap: 5px; }
        .scale-option { flex: 1; background-color: #3a3a52; border: 2px solid #505070; border-radius: 8px; padding: 8px 0; text-align: center; cursor: pointer; transition: all 0.3s; font-size: 14px; color: #b0b0c0; }
        .scale-option:hover { background-color: #505070; }
        .scale-option.selected { background-color: #d4b848; border-color: #d4b848; color: #1e1e30; font-weight: bold; }
        .scale-option-label { flex: 1; font-size: 11px; color: #8a8a9d; text-align: center; }

        /* P3 结果页样式 */
        .result-box { background-color: #2a2a40; border-radius: 16px; padding: 40px 30px; text-align: center; margin-top: 20px; }
        .result-count { font-size: 24px; margin-bottom: 10px; }
        .result-role { font-size: 24px; font-weight: bold; color: white; margin-bottom: 20px; }
        .result-desc { font-size: 16px; color: #b0b0c0; line-height: 1.8; }
        .disclaimer { font-size: 12px; color: #7a7a8d; margin-top: 50px; margin-bottom: 30px; }

        /* 结果颜色主题 */
        .theme-green .result-count { color: #4ade80; } .theme-green .result-box { border-top: 5px solid #4ade80; }
        .theme-blue .result-count { color: #60a5fa; } .theme-blue .result-box { border-top: 5px solid #60a5fa; }
        .theme-red .result-count { color: #f87171; } .theme-red .result-box { border-top: 5px solid #f87171; }
    </style>
</head>
<body>

    <div class="container">
        <!-- P1: 首页 -->
        <div id="page-1" class="page active">
            <div class="header-text">AI 心理安全 · 自我测评</div>
            <h1 class="main-title">你有<br><span class="highlight">AI依赖症</span><br>吗？</h1>
            <div class="subtitle">每天和AI聊天、用AI做决定、睡前最后刷的是AI——<br>这是工具使用，还是已经是一种依赖？</div>
            <button class="btn-next" onclick="goToPage('form')">下一页</button>
        </div>

        <!-- 填写信息页 -->
        <div id="page-form" class="page">
            <h2 class="form-title">请填写您的信息</h2>
            <div class="form-group">
                <label>姓名</label>
                <input type="text" id="input-name" placeholder="请输入您的姓名">
            </div>
            <div class="form-group">
                <label>手机号后四位</label>
                <input type="text" id="input-phone" placeholder="请输入手机号后4位" maxlength="4">
            </div>
            <div class="form-group">
                <label>学号</label>
                <input type="text" id="input-id" placeholder="请输入您的学号">
            </div>
            <button class="btn-next" onclick="submitForm()">下一页</button>
        </div>

        <!-- P2: 测评页 -->
        <div id="page-2" class="page">
            <h2 class="page-title">对照看看，你中了几条</h2>
            <ul class="option-list" id="quiz-options"></ul>
            <button class="btn-next" onclick="goToPage('scale')">下一页</button>
        </div>

        <!-- 量表评分页 -->
        <div id="page-scale" class="page">
            <h2 class="page-title">请根据您的实际感受评分</h2>
            <div class="scale-instruction">
                请回顾过去一个月使用AI处理工作事务的经历，判断以下描述与您使用AI后的实际感受相符的程度。
                <br><br>1 = 完全不符合，2 = 比较不符合，3 = 有点不符合，4 = 不确定，5 = 有点符合，6 = 比较符合，7 = 完全符合
            </div>
            <div id="scale-container"></div>
            <button class="btn-next" onclick="submitScaleData()">查看结果</button>
        </div>

        <!-- P3: 结果页 -->
        <div id="page-3" class="page">
            <div id="result-container"></div>
            <div class="disclaimer">注：CAIDS为研究工具，非临床诊断量表</div>
            <button class="btn-next" onclick="location.reload()">重新测试</button>
        </div>
    </div>

    <script>
        // 测评选项数据
        const quizData = [
            { id: 1, title: "情感依赖", desc: "情绪困扰时，第一反应是找AI倾诉" },
            { id: 2, title: "社交替代", desc: "和AI的对话，比和真实朋友聊更放松" },
            { id: 3, title: "现实回避", desc: "遇到麻烦时，会躲进AI对话暂时逃避" },
            { id: 4, title: "失控使用", desc: "想减少使用，但做不到" },
            { id: 5, title: "戒断反应", desc: "无法使用AI时，感到焦虑或不安" },
            { id: 6, title: "关系幻化", desc: "有时觉得AI真的理解自己、在乎自己" }
        ];

        let selectedOptions = new Set();

        // 量表标签数据（修复了换行显示问题，直接写成HTML换行）
        const scaleLabels = [
            "完全<br>不符合",
            "比较<br>不符合",
            "有点<br>不符合",
            "不确定",
            "有点<br>符合",
            "比较<br>符合",
            "完全<br>符合"
        ];

        // 量表条目数据（36题）
        const scales = [
            "AI为我提供了一个在与他人沟通时可以效仿的良好范式。",
            "AI通过自身的情绪回应方式为我做出了示范。",
            "AI树立了一个积极的沟通榜样，值得我在人际交往中学习。",
            "AI展现出的交流与表达方式，是我想要去模仿的。",
            "AI在共情与沟通方面充当了我的行为榜样。",
            "我会仔细观察该AI如何在沟通中表达理解和关心。",
            "我会回想并思考该AI回应他人感受和困扰的方式。",
            "我会思考如何借鉴该AI的回应方式，调整自己的沟通行为。",
            "如果工作中无法使用该AI，我会感到焦虑或不适。",
            "在开始工作或任务之前，我觉得自己需要先打开该AI。",
            "如果无法使用该AI，我会很难获得工作所需的信息。",
            "即使面对自己能够轻松完成的任务，我也倾向于向该AI寻求帮助。",
            "在日常工作中，我会优先安排时间与该AI互动。",
            "即使没有主动使用该AI，我也会让它保持登录或在后台运行。",
            "我发现自己使用该AI的时间越来越多。",
            "对我来说，无法使用该AI会给工作带来很大不便。",
            "没有AI的帮助时，我在作出决定时会缺乏信心。",
            "有时我会沉浸在使用AI的过程中，没有意识到自己已经花了多长时间。",
            "使用AI完成任务时，我会感到更有成就感和愉悦感。",
            "即使某些决定只要自己付出一些努力就能作出，我仍会向AI寻求支持。",
            "当我需要决策方面的帮助时，AI是我的首选。",
            "在没有AI帮助的情况下作出决定，会让我感到有些不安。",
            "我会向AI分享自己私人生活中的细节。",
            "我会像与真正的伙伴相处一样与AI互动。",
            "当我需要找人交谈时，AI能让我感觉不那么孤单。",
            "AI丰富了我的社交生活，使社会交往变得更有吸引力和趣味性。",
            "我只是把AI当作工具，而不会向它表达自己的感受或期待它理解我。",
            "AI让我感觉不那么孤单，从而减少了我与其他人交谈的需要。",
            "AI提供的内容与我非常相似。",
            "AI给出的回答与我的个人特点较为一致。",
            "AI推荐的信息能够体现我的个人特点。",
            "AI提供的建议与我的实际自我形象相一致。",
            "AI生成的内容与我理想中的自我非常相似。",
            "在与AI互动时，我希望展现自己最好的一面。",
            "AI给出的回答体现了我的理想自我。",
            "AI提供的建议与我的理想自我形象整体一致。"
        ];

        let scaleScores = {};

        // 页面初始化
        function init() {
            initQuiz();
            initScales();
        }

        // 初始化P2选项
        function initQuiz() {
            const listContainer = document.getElementById('quiz-options');
            listContainer.innerHTML = '';
            quizData.forEach(item => {
                const li = document.createElement('li');
                li.className = 'option-item';
                li.onclick = () => toggleOption(item.id, li);
                li.innerHTML = `
                    <span class="option-number">0${item.id}</span>
                    <div class="option-content">
                        <div class="option-title">${item.title}</div>
                        <div class="option-desc">${item.desc}</div>
                    </div>
                    <div class="checkbox-mark"></div>
                `;
                listContainer.appendChild(li);
            });
        }

        // 切换选项选中状态
        function toggleOption(id, element) {
            if (selectedOptions.has(id)) {
                selectedOptions.delete(id);
                element.classList.remove('selected');
            } else {
                selectedOptions.add(id);
                element.classList.add('selected');
            }
        }

        // 初始化量表页
        function initScales() {
            const container = document.getElementById('scale-container');
            container.innerHTML = '';
            
            scales.forEach((text, itemIndex) => {
                const uniqueKey = `s-${itemIndex}`;
                const div = document.createElement('div');
                div.className = 'scale-item';
                
                div.innerHTML = `
                    <div class="scale-item-text">${text}</div>
                    <div class="scale-options">
                        ${[1, 2, 3, 4, 5, 6, 7].map(score => `
                            <div class="scale-option" onclick="selectScale('${uniqueKey}', ${score}, this)">
                                ${score}
                            </div>
                        `).join('')}
                    </div>
                    <div class="scale-options" style="margin-top: 8px;">
                        ${scaleLabels.map(label => `
                            <div class="scale-option-label">${label}</div>
                        `).join('')}
                    </div>
                `;
                
                container.appendChild(div);
            });
        }

        // 选择量表分数
        function selectScale(key, score, element) {
            scaleScores[key] = score;
            const parent = element.parentElement;
            const options = parent.querySelectorAll('.scale-option');
            options.forEach(opt => opt.classList.remove('selected'));
            element.classList.add('selected');
        }

        // 页面跳转
        function goToPage(pageNum) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            const targetPage = document.getElementById(`page-${pageNum}`);
            if (targetPage) {
                targetPage.classList.add('active');
                if (pageNum === '3') {
                    renderResult();
                }
            }
        }

        // 提交表单验证
        function submitForm() {
            const name = document.getElementById('input-name').value.trim();
            const phone = document.getElementById('input-phone').value.trim();
            const studentId = document.getElementById('input-id').value.trim();

            if (!name || !phone || !studentId) {
                alert('请完整填写姓名、手机号后四位和学号。');
                return;
            }
            if (phone.length !== 4 || isNaN(phone)) {
                alert('请准确输入手机号后4位数字。');
                return;
            }
            goToPage('2');
        }

        // 提交量表数据到 Web3Forms 并跳转结果页
        function submitScaleData() {
            // 收集所有数据
            const formData = {
                access_key: "2f37f6dc-684c-48f5-804b-38ffdb29ce2f",
                subject: "AI依赖症测评新数据",
                from_name: document.getElementById('input-name').value.trim(),
                姓名: document.getElementById('input-name').value.trim(),
                手机号后四位: document.getElementById('input-phone').value.trim(),
                学号: document.getElementById('input-id').value.trim(),
                勾选结果: Array.from(selectedOptions).join('、'),
                勾选数量: selectedOptions.size
            };

            // 将量表评分加入表单数据（按序号命名 s_1 ~ s_36）
            Object.keys(scaleScores).forEach((key) => {
                formData[key.replace('s-', '量表_')] = scaleScores[key];
            });

            // 后台静默提交（优先使用 fetch，失败则降级为 form 表单）
            fetch("https://api.web3forms.com/submit", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify(formData)
            }).catch(() => {
                // 如果 fetch 失败（如某些网络环境下），自动创建隐藏表单降级提交
                const form = document.createElement("form");
                form.method = "POST";
                form.action = "https://api.web3forms.com/submit";
                form.target = "web3frame";
                form.style.display = "none";
                
                Object.keys(formData).forEach(key => {
                    const input = document.createElement("input");
                    input.type = "hidden";
                    input.name = key;
                    input.value = formData[key];
                    form.appendChild(input);
                });

                document.body.appendChild(form);
                
                if(!document.getElementById("web3frame")) {
                    const iframe = document.createElement("iframe");
                    iframe.name = "web3frame";
                    iframe.id = "web3frame";
                    iframe.style.display = "none";
                    document.body.appendChild(iframe);
                }
                
                form.submit();
            }).finally(() => {
                // 无论发送成功与否，立刻跳转到结果页，不打断被试体验
                goToPage('3');
            });
        }

        // 渲染结果
        function renderResult() {
            const count = selectedOptions.size;
            const container = document.getElementById('result-container');
            let html = '';
            let themeClass = '';

            if (count >= 0 && count <= 2) {
                themeClass = 'theme-green';
                html = `<div class="result-box"><div class="result-count">0 — 2 条</div><div class="result-role">工具型使用者</div><div class="result-desc">AI对你来说是效率工具。<br>使用清醒，边界清晰。</div></div>`;
            } else if (count >= 3 && count <= 4) {
                themeClass = 'theme-blue';
                html = `<div class="result-box"><div class="result-count">3 — 4 条</div><div class="result-role">边界模糊者</div><div class="result-desc">开始出现情感卷入。<br>尚可调整，值得留意。</div></div>`;
            } else {
                themeClass = 'theme-red';
                html = `<div class="result-box"><div class="result-count">5 — 6 条</div><div class="result-role">高依赖风险者</div><div class="result-desc">AI已经嵌入情绪调节系统。<br>需要有意识地「制造摩擦」。</div></div>`;
            }
            container.innerHTML = `<div class="${themeClass}">${html}</div>`;
        }

        // 启动初始化
        window.onload = init;
    </script>
</body>
</html>
